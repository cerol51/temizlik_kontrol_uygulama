services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wc_cleaning}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wc_cleaning}
      POSTGRES_DB: ${POSTGRES_DB:-wc_cleaning}
    ports:
      - "5432:5432"
    volumes:
      - wc-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-wc_cleaning} -d $${POSTGRES_DB:-wc_cleaning}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-wc_cleaning}:${POSTGRES_PASSWORD:-wc_cleaning}@postgres:5432/${POSTGRES_DB:-wc_cleaning}
      JWT_SECRET: ${JWT_SECRET:-wc_production_jwt_secret_change_me_immediately_12345}
      CORS_ORIGIN: "http://localhost,http://localhost:80,http://localhost:5173"
    ports:
      - "3000:3000"
    volumes:
      - wc-uploads:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

volumes:
  wc-postgres:
  wc-uploads:
